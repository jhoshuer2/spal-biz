name: Spal reminders (manual test only)
# The every-10-minutes timer now lives in Supabase (pg_cron), see supabase/scheduler.sql, so reminders do not depend on GitHub billing.
# This job stays only as a button: Actions > "Spal reminders (manual test only)" > Run workflow, to check the app answers.
on:
  workflow_dispatch: {}
jobs:
  nudge:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ask Spal to check reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set in GitHub."; exit 1; fi
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST "https://spal-biz.vercel.app/api/cron/nudges" -H "Authorization: Bearer $CRON_SECRET" --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors) || { echo "Could not reach the app."; exit 1; }
          echo "HTTP $code"; cat response.txt; echo
          case "$code" in 2*) exit 0 ;; 401) echo "The secret in GitHub does not match CRON_SECRET in Vercel." ;; 503) echo "The app is missing a setting in Vercel." ;; esac
          exit 1
